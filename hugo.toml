# ─────────────────────────────────────────────────────────────────────────
# gfl — Modern Greek course (Hugo + hugo-coder), instantiated from pagegen.
#
# Only the per-course values marked in the template are changed here; the
# shared standard (markup, pagination, ToC, taxonomies, module import) is
# left exactly as pagegen ships it. See ROADMAP.md §3 for the binding list.
#
# Variety: Standard Modern Greek (Dimotiki), monotonic orthography.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/gfl/"
title = "Ελληνικά — Greek course — S. Le Boulanger"
languageCode = "el"
defaultContentLanguage = "el"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Ελληνικά"
  author = "S. Le Boulanger"
  description = "A free, openly-licensed Modern Greek course: a Level 0 alphabet stage followed by CEFR A1–B1 units, exams, printable materials and native-voice audio."
  keywords = "Greek,Modern Greek,Ελληνικά,Greek alphabet,monotonic,CEFR,A1,A2,B1,curriculum,OER,Gesamtschule"
  dateFormat = "2006-01-02"
  since = 2025
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (gfl: #C74A23 light / #E7977E dark). Never edit the CSS to change it.
  code = "gfl"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance in Germany (see /datenschutz/). Leave `domain` empty to disable.
    domain = "boulingua.github.io/gfl"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/gfl"

# ── Navigation — mirrors content/. Start lives behind the navbar brand. ────
# Groups carry an identifier; children set `parent`. Level 0 precedes A1:
# the Greek alphabet is taught before any communicative content lands.
[[menu.main]]
  name = "Levels"
  weight = 2
  identifier = "levels"
[[menu.main]]
  parent = "levels"
  weight = 20
  name = "Level 0 — Το αλφάβητο"
